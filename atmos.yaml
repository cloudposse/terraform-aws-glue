commands:
- name: readme
  steps:
    - "atmos docs generate readme"
    - "atmos docs generate readme-submodule-catalog-database"
    - "atmos docs generate readme-submodule-catalog-table"
    - "atmos docs generate readme-submodule-catalog-connection"
    - "atmos docs generate readme-submodule-catalog-crawler"
    - "atmos docs generate readme-submodule-catalog-job"
    - "atmos docs generate readme-submodule-catalog-registry"
    - "atmos docs generate readme-submodule-catalog-schema"
    - "atmos docs generate readme-submodule-catalog-trigger"
    - "atmos docs generate readme-submodule-catalog-workflow"

- name: test
  commands:
  - name: "init"
    description: Initialize tests
    steps:
      - "make -C test/src init"

  - name: "run"
    description: Run tests
    steps:
      - "cd test/src && go mod tidy"
      - "cd test/src && go test -v -timeout 60m"

  - name: "clean"
    description: Clean tests
    steps:
      - "make -C test/src clean"
      - "rm -rf examples/*/.terraform examples/*/.terraform.lock.hcl"
